      <path d="M18 44H212" stroke="#97958e" stroke-dasharray="4 4"/>
      <text x="20" y="72" font-size="13">PUBLIC RECORDS</text>
      <text x="20" y="98" font-size="13">REPEAT VISITS</text>
      <text x="20" y="124" font-size="13">PROXIMITY CHECK</text>
      <path d="M18 140H212" stroke="#97958e" stroke-dasharray="4 4"/>
      <text x="20" y="166" font-size="12">QUESTION:</text>
      <text x="20" y="190" font-size="18" font-weight="700">WHAT'S FOR LUNCH?</text>
    </g>
