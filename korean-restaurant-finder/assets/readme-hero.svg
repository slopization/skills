    <rect width="246" height="43" rx="3" fill="#ff8cc6"/>
    <text x="123" y="28" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="700" fill="#171b24">HUNGRY. WITH SOURCES.</text>
  </g>
  <g transform="translate(866 91) rotate(7 116 105)">
    <path d="M6 7H236V223L224 215 212 223 200 215 188 223 176 215 164 223 152 215 140 223 128 215 116 223 104 215 92 223 80 215 68 223 56 215 44 223 32 215 20 223 6 215Z" fill="#05070b"/>
    <path d="M0 0H230V216L218 208 206 216 194 208 182 216 170 208 158 216 146 208 134 216 122 208 110 216 98 208 86 216 74 208 62 216 50 208 38 216 26 208 14 216 0 208Z" fill="#ece9df"/>
    <g font-family="Consolas, 'Courier New', monospace" fill="#171b24">
