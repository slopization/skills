  <path d="M34 331H1166" stroke="#353b48"/>
  <text x="40" y="358" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#b9c2d2">FOLLOW THE RECEIPTS. FIND THE REPEATS.</text>
  <text x="1160" y="358" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#c7ff6b">EVIDENCE INCLUDED / APPETITE REQUIRED</text>
