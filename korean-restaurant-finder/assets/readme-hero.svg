  <g transform="translate(758 255)">
    <circle r="59" fill="#ae9bff"/>
    <path d="M-24-29Q-33-41-23-49M-2-29Q-11-41-1-49M20-29Q11-41 21-49" fill="none" stroke="#171b24" stroke-width="4" stroke-linecap="round"/>
    <path d="M-39-14H39C35 19 21 31 0 31S-35 19-39-14Z" fill="#171b24"/>
