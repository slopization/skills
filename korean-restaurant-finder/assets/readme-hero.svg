<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Lunch Investigation Unit</title>
  <desc id="desc">A lime and charcoal case-file banner for Korean Restaurant Finder, with a receipt, a noodle bowl, and the words: Follow the receipts. Find the repeats.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#292e3a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="380" rx="18" fill="#10141c"/>
  <rect x="1" y="1" width="1198" height="378" rx="17" fill="url(#grid)" stroke="#353b48"/>
  <rect x="32" y="28" width="140" height="29" rx="3" fill="#c7ff6b"/>
  <text x="102" y="48" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" fill="#171b24">CASE FILE / 001</text>
  <text x="1160" y="48" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="1" fill="#b9c2d2">KOREAN RESTAURANT FINDER</text>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="900" letter-spacing="-3">
    <text x="40" y="137" font-size="74" fill="#f2f1e9">LUNCH</text>
    <text x="40" y="212" font-size="74" fill="#c7ff6b">INVESTIGATION</text>
    <text x="40" y="287" font-size="74" fill="#f2f1e9">UNIT.</text>
  </g>
  <g transform="translate(276 244) rotate(-5)">
